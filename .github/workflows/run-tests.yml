name: Run Tests
run-name: Run Tests triggered by ${{ github.ref_type }} ${{ github.ref_name }} or ${{ github.triggering_actor }}

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: "21 11 * * 0"

jobs:
  lint:
    name: Lint rms-host-cassini
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: 3.13

      # The host needs the oops.Host API from the rms-oops mrs_260925_host_reorg branch,
      # which is not released. Remove the second install once it is on PyPI.
      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install --force-reinstall --no-deps "rms-oops @ git+https://github.com/SETI/rms-oops@mrs_260925_host_reorg"

      # Ruff is the linter of record for every rule it implements.
      - name: Ruff
        run: |
          ruff check src tests

      # Ruff implements no rule in the E121-E133 range, so continuation-line
      # indentation is the one pycodestyle family it cannot gate. This step reads the
      # per-file-ignores in .flake8.
      - name: Flake8 continuation-line indent
        run: |
          flake8 --select=E12,E13 src tests

      # Every module under tests/ is checked. src/ is deliberately unannotated, so
      # mypy treats it as Any through the overrides in pyproject.toml.
      - name: Mypy
        run: |
          MYPYPATH=src mypy tests

      # rms-oops is installed from GitHub rather than PyPI, so pip-audit lists it as
      # skipped rather than audited.
      - name: pip-audit
        run: |
          pip-audit --skip-editable

      - name: Codespell
        run: |
          codespell src tests CLAUDE.md

      - name: PyMarkdown
        run: |
          pymarkdown scan -r .claude/ CLAUDE.md

  test:
    name: Test rms-host-cassini
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
      fail-fast: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # See the matching step in the lint job.
      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install --force-reinstall --no-deps "rms-oops @ git+https://github.com/SETI/rms-oops@mrs_260925_host_reorg"

      # The tests need no SPICE kernels or data files; see tests/conftest.py.
      - name: Test with coverage
        run: |
          python -m pytest --cov-report=xml

      - name: Print coverage report
        run: |
          coverage report -m

      - name: Upload coverage report to codecov
        uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && !github.event.pull_request.head.repo.fork
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
